name: India News Hub Real Video Renderer

on:
  workflow_dispatch:
    inputs:
      voice_file_id:
        description: 'Google Drive Voice File ID'
        required: true
        type: string
      render_input_file_id:
        description: 'Google Drive Render Input File ID'
        required: true
        type: string

jobs:
  render-real:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4 
      - name: Download news input, voice and visuals
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_AUDIO_FILE_ID: ${{ inputs.voice_file_id }}
          NEWS_RENDER_INPUT_FILE_ID: ${{ inputs.render_input_file_id }}
        run: |
          python3 -m pip install --quiet google-auth

          python3 - <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          session = AuthorizedSession(credentials)

          os.makedirs("input", exist_ok=True)
          os.makedirs("input/visuals", exist_ok=True)

          def download_file(file_id, output_path):
              url = (
                  "https://www.googleapis.com/drive/v3/files/"
                  + file_id
                  + "?alt=media"
              )

              response = session.get(url, stream=True)
              response.raise_for_status()

              with open(output_path, "wb") as f:
                  for chunk in response.iter_content(
                      chunk_size=1024 * 1024
                  ):
                      if chunk:
                          f.write(chunk)

          download_file(
              os.environ["NEWS_RENDER_INPUT_FILE_ID"],
              "input/news.json"
          )

          download_file(
              os.environ["NEWS_AUDIO_FILE_ID"],
              "input/voice.wav"
          )

          with open("input/news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          visuals = data.get("visuals", [])

          if len(visuals) < 4:
              raise RuntimeError(
                  "news.json must contain at least 4 visual assets."
              )

          for index, visual in enumerate(visuals[:4], 1):
              file_id = str(
                  visual.get("fileId", "")
              ).strip()

              if not file_id:
                  raise RuntimeError(
                      f"Visual file ID missing for scene {index}"
                  )

              output_path = (
                  f"input/visuals/scene{index}.jpg"
              )

              download_file(
                  file_id,
                  output_path
              )

              print(
                  "DOWNLOAD SUCCESS: visual scene",
                  index,
                  file_id
              )

          print("DOWNLOAD SUCCESS: news.json")
          print("DOWNLOAD SUCCESS: voice.wav")
          PY

          echo "Downloaded files:"
          find input -maxdepth 2 -type f -ls
      - name: Build FFmpeg renderer
        run: docker build -t india-news-hub-renderer .

      - name: Run real news renderer
        run: |
          mkdir -p output

          docker run --rm \
            -v "${{ github.workspace }}/input:/workspace/input" \
            -v "${{ github.workspace }}/output:/workspace/output" \
            --entrypoint /app/render-real.sh \
            india-news-hub-renderer

          echo "Rendered output:"
          ls -lh output/

          test -f output/india-news-hub-real-test.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-news-hub-real-video
          path: output/india-news-hub-real-test.mp4
          if-no-files-found: error
          retention-days: 1
