name: India News Hub Real Video Renderer

on:
  workflow_dispatch:

jobs:
  render-real:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Download news input and voice
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_AUDIO_FILE_ID: ${{ secrets.NEWS_AUDIO_FILE_ID }}
          NEWS_RENDER_INPUT_FILE_ID: ${{ secrets.NEWS_RENDER_INPUT_FILE_ID }}
        run: |
          python3 -m pip install --quiet google-auth

          python3 - <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          session = AuthorizedSession(credentials)

          os.makedirs("input", exist_ok=True)

          files = {
              "news.json": os.environ["NEWS_RENDER_INPUT_FILE_ID"],
              "voice.wav": os.environ["NEWS_AUDIO_FILE_ID"]
          }

          for filename, file_id in files.items():
              url = "https://www.googleapis.com/drive/v3/files/" + file_id + "?alt=media"

              response = session.get(url, stream=True)
              response.raise_for_status()

              with open("input/" + filename, "wb") as f:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

              print("DOWNLOAD SUCCESS:", filename)
          PY

          ls -lh input/

      - name: Build FFmpeg renderer
        run: docker build -t india-news-hub-renderer .

      - name: Render final MP4
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/input:/workspace/input" \
            -v "${{ github.workspace }}/output:/workspace/output" \
            --entrypoint /app/render-real.sh \
            india-news-hub-renderer

      - name: Upload MP4 to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_RENDER_OUTPUT_FOLDER_ID: ${{ secrets.NEWS_RENDER_OUTPUT_FOLDER_ID }}
        run: |
          python3 -m pip install --quiet google-auth google-api-python-client

          python3 - <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"]
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          folder_id = os.environ["NEWS_RENDER_OUTPUT_FOLDER_ID"]

          file_path = "output/india-news-hub-real-test.mp4"

          metadata = {
              "name": "India-News-Hub-" + os.environ.get("GITHUB_RUN_ID", "render") + ".mp4",
              "parents": [folder_id]
          }

          media = MediaFileUpload(
              file_path,
              mimetype="video/mp4",
              resumable=True
          )

          result = service.files().create(
              body=metadata,
              media_body=media,
              fields="id,name,webViewLink"
          ).execute()

          print("DRIVE VIDEO UPLOAD: SUCCESS")
          print("FILE ID:", result.get("id"))
          print("FILE NAME:", result.get("name"))
          print("DRIVE LINK:", result.get("webViewLink"))
          PY

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-news-hub-real-video
          path: output/india-news-hub-real-test.mp4
          retention-days: 1
