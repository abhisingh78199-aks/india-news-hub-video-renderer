name: India News Hub Real Video Renderer

on:
  workflow_dispatch:
    inputs:
      voice_file_id:
        description: 'Google Drive Voice File ID'
        required: true
        type: string
      render_input_file_id:
        description: 'Google Drive Render Input File ID'
        required: true
        type: string

jobs:
  render-real:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Download news input, voice and scene visuals
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_AUDIO_FILE_ID: ${{ inputs.voice_file_id }}
          NEWS_RENDER_INPUT_FILE_ID: ${{ inputs.render_input_file_id }}
        run: |
          python3 -m pip install --quiet google-auth

          python3 - <<'PY'
          import json
          import os
          import re
          import mimetypes
          from pathlib import Path
          from urllib.parse import urlparse
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          session = AuthorizedSession(credentials)

          Path("input").mkdir(exist_ok=True)
          Path("input/assets").mkdir(exist_ok=True)

          def download_drive_file(file_id, output_path):
              meta_url = (
                  "https://www.googleapis.com/drive/v3/files/"
                  + file_id
                  + "?fields=name,mimeType,size"
              )
              meta = session.get(meta_url)
              meta.raise_for_status()
              meta_json = meta.json()

              mime = meta_json.get("mimeType", "")
              if not mime.startswith("image/"):
                  return False

              media_url = (
                  "https://www.googleapis.com/drive/v3/files/"
                  + file_id
                  + "?alt=media"
              )

              response = session.get(media_url, stream=True)
              response.raise_for_status()

              with open(output_path, "wb") as f:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

              return True

          def download_url(url, output_path):
              try:
                  response = session.get(url, stream=True, timeout=30)
                  response.raise_for_status()
                  content_type = response.headers.get("content-type", "")
                  if not content_type.startswith("image/"):
                      return False

                  with open(output_path, "wb") as f:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              f.write(chunk)

                  return True
              except Exception:
                  return False

          # Download render input JSON.
          render_url = (
              "https://www.googleapis.com/drive/v3/files/"
              + os.environ["NEWS_RENDER_INPUT_FILE_ID"]
              + "?alt=media"
          )

          response = session.get(render_url, stream=True)
          response.raise_for_status()

          with open("input/news.json", "wb") as f:
              for chunk in response.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      f.write(chunk)

          # Download voice.
          voice_url = (
              "https://www.googleapis.com/drive/v3/files/"
              + os.environ["NEWS_AUDIO_FILE_ID"]
              + "?alt=media"
          )

          response = session.get(voice_url, stream=True)
          response.raise_for_status()

          with open("input/voice.wav", "wb") as f:
              for chunk in response.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      f.write(chunk)

          with open("input/news.json", encoding="utf-8") as f:
              data = json.load(f)

          # Find scene visual references without depending on one exact JSON key.
          found = []

          def walk(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      key_l = str(key).lower()
                      if isinstance(value, str):
                          if re.fullmatch(r"[A-Za-z0-9_-]{25,50}", value):
                              if any(x in key_l for x in [
                                  "image", "visual", "asset", "media", "file"
                              ]):
                                  found.append(("drive", value))
                          elif value.startswith("http://") or value.startswith("https://"):
                              if any(x in key_l for x in [
                                  "image", "visual", "asset", "media", "url"
                              ]):
                                  found.append(("url", value))
                      walk(value)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          walk(data)

          # Keep order and remove duplicates.
          unique = []
          seen = set()
          for item in found:
              if item[1] not in seen:
                  seen.add(item[1])
                  unique.append(item)

          downloaded = 0

          for kind, ref in unique:
              if downloaded >= 4:
                  break

              scene_number = downloaded + 1

              if kind == "drive":
                  ok = download_drive_file(
                      ref,
                      f"input/assets/scene{scene_number}.jpg"
                  )
              else:
                  ok = download_url(
                      ref,
                      f"input/assets/scene{scene_number}.jpg"
                  )

              if ok:
                  downloaded += 1
                  print("VISUAL DOWNLOAD SUCCESS:", scene_number, ref)

          print("SCENE VISUALS DOWNLOADED:", downloaded)
          print("Downloaded files:")
          PY

          echo "Downloaded input files:"
          find input -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Build FFmpeg renderer
        run: docker build -t india-news-hub-renderer .

      - name: Run real news renderer
        run: |
          mkdir -p output

          docker run --rm \
            -v "${{ github.workspace }}/input:/workspace/input" \
            -v "${{ github.workspace }}/output:/workspace/output" \
            --entrypoint /app/render-real.sh \
            india-news-hub-renderer

          echo "Rendered output:"
          ls -lh output/

          test -s output/india-news-hub-real-test.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-news-hub-real-video
          path: output/india-news-hub-real-test.mp4
          if-no-files-found: error
          retention-days: 1
