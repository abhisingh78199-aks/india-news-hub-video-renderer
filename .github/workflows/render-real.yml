name: India News Hub Real Video Renderer

on:
  workflow_dispatch:

jobs:
  render-real:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Download voice from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEWS_AUDIO_FILE_ID: ${{ secrets.NEWS_AUDIO_FILE_ID }}
        run: |
          python3 -m pip install --quiet google-auth

          python3 - <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          session = AuthorizedSession(credentials)

          file_id = os.environ["NEWS_AUDIO_FILE_ID"]

          url = "https://www.googleapis.com/drive/v3/files/" + file_id + "?alt=media"

          response = session.get(url, stream=True)
          response.raise_for_status()

          os.makedirs("input", exist_ok=True)

          with open("input/voice.wav", "wb") as f:
              for chunk in response.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      f.write(chunk)

          print("VOICE DOWNLOAD: SUCCESS")
          PY

          ls -lh input/voice.wav

      - name: Build FFmpeg renderer
        run: docker build -t india-news-hub-renderer .

      - name: Run real input renderer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/input:/workspace/input" \
            -v "${{ github.workspace }}/output:/workspace/output" \
            --entrypoint /app/render-real.sh \
            india-news-hub-renderer

      - name: Upload real MP4
        uses: actions/upload-artifact@v4
        with:
          name: india-news-hub-real-video
          path: output/india-news-hub-real-test.mp4
          retention-days: 1
